[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CiteCheck"
version = "0.1.0"
description = "Check academic paper citations for format, queryability, thematic relevance, and semantic accuracy."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Paper Citation Check Team"},
]
keywords = ["citation", "academic", "paper", "reference", "bibliography", "latex", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23.0"]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1.0"]

[project.scripts]
citecheck = "citecheck.cli:main"

[project.urls]
Homepage = "https://github.com/color4-alt/CiteCheck"
Repository = "https://github.com/color4-alt/CiteCheck"
Issues = "https://github.com/color4-alt/CiteCheck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
